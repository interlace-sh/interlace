name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,service,adbc]"

      - name: Run tests
        run: pytest tests/ -x -q --tb=short -m "not slow and not requires_db"

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_notes.py "$GITHUB_REF_NAME" \
            --notes-out "$RUNNER_TEMP/notes.md" \
            --title-out "$RUNNER_TEMP/title.txt"
          TITLE="$(cat "$RUNNER_TEMP/title.txt")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi
