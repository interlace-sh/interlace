name: benchmark
default_dialect: duckdb
# DuckLake warehouse (Parquet + catalog) — worth it at this scale, and what the
# reference numbers in README.md were measured on. The project default is a plain
# DuckDB file. The scale knob is ROWS in models/events.sql —
# 25M by default; bump it to 100M+ to make the machine work for its dinner.
database: ducklake:.interlace/warehouse.ducklake

# An external database interlace delivers into (reverse ETL) — the append model
# `daily_feed` writes here. Attached read/write, never owned by interlace.
attach:
  serving: serving.duckdb
