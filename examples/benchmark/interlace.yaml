name: benchmark
default_dialect: duckdb
# The warehouse is the default: one plain DuckDB file. The reference numbers in
# README.md were measured on DuckLake (Parquet + catalog) — add
# `database: ducklake:.interlace/warehouse.ducklake` to reproduce them. Left off by
# default because the DAG here doubles as a test fixture, and the DuckLake write
# path costs it memory it does not need.
#
# The scale knob is the range() in models/events.sql — 25M by default; bump it to
# 100M+ to make the machine work for its dinner.

# An external database interlace delivers into (reverse ETL) — the append model
# `daily_feed` writes here. Attached read/write, never owned by interlace.
attach:
  serving: serving.duckdb
