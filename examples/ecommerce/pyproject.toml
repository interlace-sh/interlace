[project]
name = "interlace-ecommerce"
version = "0.1.0"
description = "Interlace ecommerce — the canonical example project"
requires-python = ">=3.12"
dependencies = ["interlace"]

[tool.uv.sources]
interlace = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
