[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interlaced"
version = "2.0.0"
description = "Python/SQL-first data platform: transformation, built-in orchestration, and durable streaming ingestion"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Mark", email = "mark@interlace.sh"}
]
keywords = ["data", "pipeline", "orchestration", "transformation", "etl", "streaming", "dbt", "sqlmesh", "duckdb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: SQL",
]

# Core: the IR + engine + state + plan spine (Phase 1). Everything is Arrow- and
# sqlglot-native. See docs/architecture/architecture.md.
dependencies = [
    "sqlglot>=25.0,<29.0",        # canonical IR, transpilation, semantic diff, column lineage
    "duckdb>=1.5.3",              # default engine + federation hub; DuckLake storage + quack serving
    "pyarrow>=17.0",              # the wire format: RecordBatchReader everywhere
    "pydantic>=2.5,<3.0",         # config + manifest validation (cold paths only)
    "typer>=0.12,<1.0",           # CLI
    "rich>=13.0,<15.0",           # display, strictly an event subscriber
    "cronsim>=2.5,<3.0",          # cron parsing for the trigger engine
    "tenacity>=8.2,<10.0",        # retries (tasks, DuckLake commit conflicts, transfers)
    "pyyaml>=6.0,<7.0",           # project config (config + env overlays)
]

[project.scripts]
interlace = "interlace.cli.main:main"

[project.optional-dependencies]
# Service + orchestration daemon (Phase 2).
service = [
    "litestar>=2.12,<3.0",
    "uvicorn>=0.30,<1.0",
    "msgspec>=0.18,<1.0",  # the wire types (litestar serialises msgspec structs natively)
]
# Remote engines via Arrow-native ADBC transfer. postgres (+ redshift, same wire)
# are the tested transport; snowflake/bigquery are ALPHA (wired, not run live).
adbc = [
    "adbc-driver-manager>=1.2,<2.0",
    "adbc-driver-postgresql>=1.2,<2.0",
]
adbc-snowflake = ["interlaced[adbc]", "adbc-driver-snowflake>=1.2,<2.0"]
adbc-bigquery = ["interlaced[adbc]", "adbc-driver-bigquery>=1.2,<2.0"]
# Spark engine: PySpark session transport (Arrow-native), Delta for mutating strategies.
# Pinned to the Spark 4.0 / Delta 4.0 pair (Delta lags the latest Spark minor).
spark = ["pyspark>=4.0,<4.1", "delta-spark>=4.0,<4.1"]
postgres = ["psycopg[binary]>=3.1,<4.0"]
polars = ["polars>=1.0,<2.0"]
pandas = ["pandas>=2.0,<4.0"]
all = ["interlaced[service,adbc,postgres,polars]"]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",  # litestar's TestClient transport
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.6,<1.0",
    "black>=24.0,<27.0",
    "mypy>=1.11,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interlace = ["py.typed", "service/ui/*", "service/ui/**/*"]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "sqlglot.*",
    "pyarrow.*",
    "yaml",
    "adbc_driver_snowflake.*",  # optional 'adbc-snowflake' extra — absent in the base env
    "adbc_driver_bigquery.*",  # optional 'adbc-bigquery' extra — absent in the base env
    "pyspark.*",  # optional 'spark' extra — absent in the base env
    "delta.*",  # optional 'spark' extra (delta-spark) — absent in the base env
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/interlace"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, require database)",
    "slow: Slow tests (may take a long time)",
    "requires_db: Needs a reachable external database (e.g. Postgres)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
