<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Interlace">
  <title>Interlace</title>
  <!-- Two loops in plain weave (matches interlace.sh). Each loop is knocked out by the
       other's own stroke at width 13 against the 6 drawn, so the clearance follows the
       curve; the clip paths confine each cut to one crossing quadrant. -->
  <style>
    .a { stroke: #6D28D9; } .b { stroke: #8B5CF6; }
    @media (prefers-color-scheme: dark) { .a { stroke: #8B5CF6; } .b { stroke: #C4B5FD; } }
  </style>
  <defs>
    <mask id="dh" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g clip-path="url(#dtl)"><rect x="20" y="6" width="24" height="52" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
      <g clip-path="url(#dbr)"><rect x="20" y="6" width="24" height="52" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
    </mask>
    <mask id="dv" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g clip-path="url(#dtr)"><rect x="6" y="20" width="52" height="24" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
      <g clip-path="url(#dbl)"><rect x="6" y="20" width="52" height="24" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
    </mask>
    <clipPath id="dtl"><rect x="10" y="10" width="18" height="18"/></clipPath>
    <clipPath id="dbr"><rect x="36" y="36" width="18" height="18"/></clipPath>
    <clipPath id="dtr"><rect x="36" y="10" width="18" height="18"/></clipPath>
    <clipPath id="dbl"><rect x="10" y="36" width="18" height="18"/></clipPath>
  </defs>
  <rect x="6" y="20" width="52" height="24" rx="12" fill="none" class="a" stroke="#8B5CF6" stroke-width="6" mask="url(#dh)"/>
  <rect x="20" y="6" width="24" height="52" rx="12" fill="none" class="b" stroke="#C4B5FD" stroke-width="6" mask="url(#dv)"/>
</svg>
