<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>interlace.sh</title>
<meta name="description" content="interlace control plane — a Python/SQL-first data platform: transformation, orchestration, and durable streaming in one daemon.">

<meta name="theme-color" content="#0B0E16">
<link rel="stylesheet" href="/ui/app.css">
<link rel="icon" type="image/svg+xml" href="/ui/favicon.svg">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#/overview" title="Overview">
      <svg class="mark" width="22" height="22" viewBox="0 0 64 64" fill="none" aria-hidden="true"><defs><mask id="ilh" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><g clip-path="url(#iltl)"><rect x="20" y="6" width="24" height="52" rx="12" fill="none" stroke="#000" stroke-width="13"/></g><g clip-path="url(#ilbr)"><rect x="20" y="6" width="24" height="52" rx="12" fill="none" stroke="#000" stroke-width="13"/></g></mask><mask id="ilv" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><g clip-path="url(#iltr)"><rect x="6" y="20" width="52" height="24" rx="12" fill="none" stroke="#000" stroke-width="13"/></g><g clip-path="url(#ilbl)"><rect x="6" y="20" width="52" height="24" rx="12" fill="none" stroke="#000" stroke-width="13"/></g></mask><clipPath id="iltl"><rect x="10" y="10" width="18" height="18"/></clipPath><clipPath id="ilbr"><rect x="36" y="36" width="18" height="18"/></clipPath><clipPath id="iltr"><rect x="36" y="10" width="18" height="18"/></clipPath><clipPath id="ilbl"><rect x="10" y="36" width="18" height="18"/></clipPath></defs><rect x="6" y="20" width="52" height="24" rx="12" fill="none" stroke="#8B5CF6" stroke-width="6" mask="url(#ilh)"/><rect x="20" y="6" width="24" height="52" rx="12" fill="none" stroke="#C4B5FD" stroke-width="6" mask="url(#ilv)"/></svg>
      <span class="wordmark">interlace<span class="wordmark-tld">.sh</span></span>
    </a>
    <button class="env-chip" id="envChip" title="Target environment (prod = the unprefixed namespace)">
      <span class="env-key">env</span><span class="env-val" id="envName">prod</span>
    </button>
    <span class="drift" id="driftChip" hidden></span>
    <div class="grow"></div>
    <button class="cmdk" id="cmdkBtn" aria-label="Search"><span>search</span><kbd>⌘K</kbd></button>
    <span class="live" id="livePill" data-state="connecting" title="Event stream">
      <span class="live-dot"></span><span class="live-label">sync</span>
    </span>
  </header>

  <nav class="rail" id="rail" aria-label="Views">
    <a data-route="overview" title="Overview"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/></svg></span><span class="lbl">home</span></a>
    <a data-route="lineage" title="Lineage"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2.5" y="9" width="5.5" height="6" rx="1.5"/><rect x="16" y="3.5" width="5.5" height="6" rx="1.5"/><rect x="16" y="14.5" width="5.5" height="6" rx="1.5"/><path d="M8 12h4m0 0V6.5h4M12 12v5.5h4"/></svg></span><span class="lbl">lineage</span></a>
    <a data-route="models" title="Models"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-13"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg></span><span class="lbl">models</span></a>
    <a data-route="plan" title="Plan &amp; apply"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4v10.5M7 20v-2m0-13L3.5 8.5M7 5l3.5 3.5"/><path d="M17 20V9.5M17 4v2m0 13.5 3.5-3.5M17 19.5 13.5 16"/></svg></span><span class="lbl">plan</span><span class="badge" data-badge="plan"></span></a>
    <a data-route="runs" title="Runs"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7.5 4.5v15l12-7.5z"/></svg></span><span class="lbl">runs</span><span class="badge" data-badge="runs"></span></a>
    <a data-route="query" title="Query console"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6.5 9.5 12 4 17.5M12.5 18.5H20"/></svg></span><span class="lbl">query</span></a>
    <a data-route="streams" title="Streams"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.5 8c2.5-3 5-3 7.5 0s5 3 7.5 0 3.5-1.6 4-1M2.5 15c2.5-3 5-3 7.5 0s5 3 7.5 0 3.5-1.6 4-1"/></svg></span><span class="lbl">streams</span></a>
    <a data-route="checks" title="Checks"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg></span><span class="lbl">checks</span></a>
    <a data-route="environments" title="Environments"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="12.5" height="12.5" rx="2"/><path d="M18.5 8.5H19a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2h-8.5a2 2 0 0 1-2-2v-.5"/></svg></span><span class="lbl">envs</span></a>
    <a data-route="system" title="System — engines, schedules, keys"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8h10m4 0h2M4 16h2m4 0h10"/><circle cx="16.5" cy="8" r="2.5"/><circle cx="8.5" cy="16" r="2.5"/></svg></span><span class="lbl">system</span></a>
    <div class="rail-foot" id="railFoot" title="daemon">…</div>
  </nav>

  <main id="view" tabindex="-1"></main>

  <aside class="dock" id="dock" hidden>
    <div class="dock-head">
      <span class="dock-title" id="dockTitle">building</span>
      <button class="dock-x" id="dockClose" aria-label="Hide">×</button>
    </div>
    <div class="dock-rows" id="dockRows"></div>
  </aside>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="palette" role="dialog" aria-label="Jump to">
    <input id="paletteInput" placeholder="model, view or run id…" autocomplete="off" spellcheck="false">
    <div class="palette-results" id="paletteResults"></div>
  </div>
</div>
<div class="scrim" id="modalScrim" hidden><div class="modal" id="modalBody" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/ui/js/app.js"></script>
</body>
</html>
