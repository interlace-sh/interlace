name: __PROJECT_NAME__
default_dialect: duckdb
# A streaming project. `interlace serve` runs the daemon — the ingestion endpoint,
# the exactly-once micro-batch materializer, and the scheduler — in one process.
# generate.py is the external producer that fires events at POST /streams/events.
# Warehouse: a plain DuckDB file (swap for `ducklake:...` for serialised concurrent writes).
database: .interlace/warehouse.duckdb
